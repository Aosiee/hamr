# A release for each version tag (vX.Y.Z): hamr built and its own suite run
# on Linux, packaged with the licence, the README, the changelog, the
# reference and the C++ test library's header, and published as a GitHub
# release whose notes are the tag's message. An existing tag is released
# again by running the workflow by hand with its name.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to release (vX.Y.Z)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: linux-x86_64
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: The pinned cluau commit
        id: pins
        run: echo "cluau=$(sed -n 's/^set(HAMR_CLUAU_COMMIT \([0-9a-f]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Check out cluau
        uses: actions/checkout@v5
        with:
          repository: Aosiee/cluau
          ref: ${{ steps.pins.outputs.cluau }}
          path: external/cluau

      # The C++ runtime is linked in, so the binary runs on any glibc Linux
      # at least as new as the runner's.
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DHAMR_CLUAU_DIR="$GITHUB_WORKSPACE/external/cluau" \
            "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
          cmake --build build -j "$(nproc)"

      # The tag names the version the binary reports.
      - name: Check the tag against the version
        run: |
          version=$(./build/hamr --version | sed -n 's/^hamr \([0-9.]*\)$/\1/p')
          if [ "v$version" != "$TAG" ]; then
            echo "the tag is $TAG, but hamr --version says $version"
            exit 1
          fi

      - name: Suite
        run: >
          ./build/hamr run
          --set cluauDir="$GITHUB_WORKSPACE/external/cluau"
          --set luauDir="$GITHUB_WORKSPACE/build/_deps/luau-src"

      - name: Package
        run: |
          dir="hamr-$TAG-linux-x86_64"
          mkdir -p "$dir/include/hamr"
          cp build/hamr LICENSE README.md CHANGELOG.md docs/reference.md "$dir/"
          cp include/hamr/test.h "$dir/include/hamr/"
          tar -czf "$dir.tar.gz" "$dir"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: hamr-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Notes from the tag
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          {
            git tag -l --format='%(contents)' "$TAG"
            echo
            echo "Install on Linux (x86-64):"
            echo
            echo '```'
            echo "curl -fsSL https://github.com/Aosiee/hamr/releases/download/$TAG/hamr-$TAG-linux-x86_64.tar.gz | tar -xz"
            echo "./hamr-$TAG-linux-x86_64/hamr --version"
            echo '```'
            echo
            echo "The download holds the \`hamr\` binary (its standard library is built in), the licence, the README, the changelog, the reference, and \`include/hamr/test.h\`, the C++ test library."
          } > notes.md
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="hamr ${TAG#v}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$title" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "$title" --notes-file notes.md --verify-tag
          fi
